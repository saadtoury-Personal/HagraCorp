# Render blueprint: New > Blueprint > pick this repo. Redeploys on every merge into main.
services:
  - type: web
    name: lunarnav-api
    runtime: docker
    dockerContext: ./LunarNav
    dockerfilePath: ./LunarNav/Dockerfile
    branch: main
    plan: free
    region: ohio   # closest Render region to Toronto
    healthCheckPath: /api/health
    autoDeploy: true
