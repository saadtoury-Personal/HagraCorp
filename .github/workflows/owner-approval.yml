name: Owner approval

# Owner approval is no longer a check here: any PR can rewrite a workflow and fake a green check of the same name.
# It is enforced by the ruleset instead (CODEOWNERS + "require code owner review", stale reviews dismissed on push).
on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  # Rulesets can't filter on the source branch, so main only accepts PRs from dev here.
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: main accepts PRs from dev only
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::PRs into main must come from $REPO:dev (got '$HEAD_REPO:$HEAD_REF')."
            exit 1
          fi
