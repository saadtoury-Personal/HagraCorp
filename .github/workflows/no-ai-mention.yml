name: No AI mention

# Blocks a PR whose title, description or human comments mention AI.
# Result is a commit status "no-ai-mention" on the PR head, so comment events
# (which run outside the PR) can still update the required check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Each run reads the PR live, so only the newest run per PR needs to finish.
concurrency:
  group: no-ai-mention-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  scan:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Scan PR text
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          head=$(jq -r .head.sha <<<"$pr")
          # Bots (e.g. CodeRabbit) are skipped: only people's words count.
          text=$({
            jq -r '.title, (.body // "")' <<<"$pr"
            gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.type != "Bot") | .body // ""'
            gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[] | select(.user.type != "Bot") | .body // ""'
            gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[] | select(.user.type != "Bot") | .body // ""'
          })
          # Case-sensitive tokens so French "j'ai" doesn't match; phrases are case-insensitive.
          hits=$( { grep -oE '\b(AI|IA|LLMs?|ChatGPT|GPT|Copilot)\b' <<<"$text" || true
                    grep -oiE 'artificial intelligence|intelligence artificielle' <<<"$text" || true; } | sort -u | paste -sd, -)
          if [ -n "$hits" ]; then
            state=failure; desc="AI mentioned: $hits"
          else
            state=success; desc="No AI mention"
          fi
          echo "$desc"
          gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=no-ai-mention -f description="${desc:0:139}" >/dev/null
