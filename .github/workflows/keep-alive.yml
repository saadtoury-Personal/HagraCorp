name: Keep API awake

# Render's free plan puts the API to sleep after 15 min without a request (first call then takes ~60 s).
# GitHub can run scheduled jobs a few minutes late, so every 5 min keeps a safe margin.
# Scheduled workflows only run from the default branch (dev). Free: the repo is public.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://lunarnav-api.onrender.com/api/health
